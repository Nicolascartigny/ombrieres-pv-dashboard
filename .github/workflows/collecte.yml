name: Collecte quotidienne FusionSolar 

on:
  push: # Déclenche l'action à chaque sauvegarde / modification du code
  schedule: 
    # Déclenchement automatique tous les matins à 05:00 UTC (06:00 heure française)
    - cron: '0 5 * * *'
  workflow_dispatch: # Permet de lancer la collecte manuellement en 1 clic

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4
        
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Installer les dépendances 
        run: pip install -r requirements.txt
        
      - name: Exécuter la collecte des données FusionSolar
        env: 
          FUSIONSOLAR_URL: "https://eu5.fusionsolar.huawei.com" # URL dédiée à l'API
          FUSIONSOLAR_USER: ${{ secrets.FUSIONSOLAR_USER }}
          FUSIONSOLAR_PASSWORD: ${{ secrets.FUSIONSOLAR_PASSWORD }}
        run: python collect_data.py
        
      - name: Enregistrer la base de données mise à jour
        run: |
          git config user.name "Robot Collecte Mauges"
          git config user.email "bot@maugesenergies.fr" 
          git add production_ombrieres.db
          git diff --staged --quiet || git commit -m "Mise à jour automatique production PV [skip ci]"
          git pull --rebase origin main
          git push
